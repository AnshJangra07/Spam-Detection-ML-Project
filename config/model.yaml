grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 5
    verbose: 2
    scoring: f1

model_selection:

  module_0:
    class: MultinomialNB
    module: sklearn.naive_bayes
    params:
      alpha:
        - 0.01
        - 0.03
        - 0.05
        - 0.10
    search_param_grid:
      alpha:
        - 0.01
        - 0.03
        - 0.05
        - 0.10

  module_1:
    class: LinearSVC
    module: sklearn.svm
    params:
      C:
        - 0.1
        - 1
        - 10
        - 100
    search_param_grid:
      C:
        - 0.1
        - 1
        - 10
        - 100

# Why I removed GaussianNB
# GaussianNB isn't the first model I'd choose for CountVectorizer text features. MultinomialNB is specifically a natural baseline for count-based text features.