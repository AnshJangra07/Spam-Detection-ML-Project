grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 5
    verbose: 2
    scoring: f1

model_selection:
  module_0:
    class: MultinomialNB
    module: sklearn.naive_bayes
    params:
      alpha:
        - 0.001
        - 0.005
        - 0.01
        - 0.03
        - 0.05
        - 0.1
        - 0.3
        - 0.5
        - 1.0
    search_param_grid:
      alpha:
        - 0.001
        - 0.005
        - 0.01
        - 0.03
        - 0.05
        - 0.1
        - 0.3
        - 0.5
        - 1.0

  module_1:
    class: LinearSVC
    module: sklearn.svm
    params:
      C:
        - 0.01
        - 0.1
        - 0.5
        - 1
        - 2
        - 5
        - 10
    search_param_grid:
      C:
        - 0.01
        - 0.1
        - 0.5
        - 1
        - 2
        - 5
        - 10
